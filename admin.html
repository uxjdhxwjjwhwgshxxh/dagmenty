<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админка Dagmenty</title>
    <style>
        body { background-color: #0d0d0d; color: #fff; font-family: sans-serif; padding: 20px; }
        h1 { color: #ff00ff; text-align: center; text-shadow: 0 0 10px #ff00ff; font-size: 24px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #00ffff; font-size: 14px; }
        input, select, textarea { width: 100%; padding: 10px; background: #1a1a1a; border: 1px solid #333; color: #fff; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #ff00ff; color: #000; border: none; border-radius: 5px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; }
        button:active { background: #00ffff; }
        .msg { text-align: center; margin-top: 15px; font-weight: bold; }
        .success { color: #00ff00; }
        .error { color: #ff0000; }
    </style>
</head>
<body>
<script>
    var password = prompt("Введите пароль для входа в админку:");
    if (password !== "temkai89891oiqavodrumka4") {
        // Если пароль неверный — полностью скрываем страницу
        document.body.innerHTML = "<h1 style='color:red; text-align:center; margin-top:50px;'>Доступ запрещен</h1>";
        document.body.style.display = "none"; // Прячем все элементы
    }
</script>
    <h1>ДОБАВИТЬ ТОВАР</h1>

    <div class="form-group">
        <label>Название (например: Doomsday 500 мощи)</label>
        <input type="text" id="title">
    </div>

    <div class="form-group">
        <label>Цена (в рублях, только цифры)</label>
        <input type="number" id="price">
    </div>

    <div class="form-group">
        <label>Категория</label>
        <select id="category">
            <option value="strategy">Стратегии</option>
            <option value="survival">Выживание</option>
            <option value="shooter">Шутеры</option>
            <option value="rpg">РПГ</option>
        </select>
    </div>

    <div class="form-group">
        <label>Описание</label>
        <textarea id="description" rows="4"></textarea>
    </div>

    <button onclick="addProduct()">ДОБАВИТЬ В МАГАЗИН</button>

    <div id="message" class="msg"></div>

    <script>
        const SUPABASE_URL = 'https://qkrwmswyhkkujzmqjfpi.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_J1l7LhGL2WCUaymu1jihJg_OE7IpYnt';

        async function addProduct() {
            const title = document.getElementById('title').value;
            const price = document.getElementById('price').value;
            const category = document.getElementById('category').value;
            const description = document.getElementById('description').value;
            const msg = document.getElementById('message');

            if (!title || !price) {
                msg.className = 'msg error';
                msg.innerText = 'Заполни хотя бы название и цену!';
                return;
            }

            msg.className = 'msg';
            msg.innerText = 'Отправляем...';

            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/products`, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=minimal'
                    },
                    body: JSON.stringify({
                        title: title,
                        price: parseInt(price),
                        game_category: category,
                        description: description
                    })
                });

                if (response.ok) {
                    msg.className = 'msg success';
                    msg.innerText = 'Товар успешно добавлен!';
                    document.getElementById('title').value = '';
                    document.getElementById('price').value = '';
                    document.getElementById('description').value = '';
                } else {
                    throw new Error('Ошибка сервера');
                }
            } catch (error) {
                msg.className = 'msg error';
                msg.innerText = 'Ошибка: ' + error.message;
            }
        }
    </script>
</body>
</html>
