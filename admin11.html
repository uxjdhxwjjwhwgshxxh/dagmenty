<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админка Dagmenty v2</title>
    <style>
        body { background-color: #0d0d0d; color: #fff; font-family: sans-serif; padding: 20px; }
        h1 { color: #ff00ff; text-align: center; text-shadow: 0 0 10px #ff00ff; font-size: 24px; }
        h2 { color: #00ffff; font-size: 18px; margin-top: 30px; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #00ffff; font-size: 14px; }
        input, select, textarea { width: 100%; padding: 10px; background: #1a1a1a; border: 1px solid #333; color: #fff; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #ff00ff; color: #000; border: none; border-radius: 5px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; }
        button:active { background: #00ffff; }
        .msg { text-align: center; margin-top: 15px; font-weight: bold; }
        .success { color: #00ff00; }
        .error { color: #ff0000; }
        
        /* Стили для списка товаров */
        .product-item { background: #151515; border: 1px solid #333; padding: 15px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .product-info { flex-grow: 1; }
        .product-title { font-weight: bold; font-size: 16px; color: #fff; }
        .product-price { color: #00ffff; font-size: 14px; margin-top: 5px; }
        .delete-btn { background: #ff0000; color: #fff; padding: 8px 12px; border: none; border-radius: 5px; font-size: 14px; cursor: pointer; margin-left: 10px; width: auto; }
    </style>
</head>
<body>

    <script>
        var password = prompt("Введите пароль для входа в админку:");
        if (password !== "temkai89891oiqavodrumka4") {
            document.body.innerHTML = "<h1 style='color:red; text-align:center; margin-top:50px;'>Доступ запрещен</h1>";
            document.body.style.display = "none";
        }
    </script>

    <h1>АДМИНКА</h1>

    <h2>Добавить товар</h2>
    <div class="form-group">
        <label>Название</label>
        <input type="text" id="title">
    </div>
    <div class="form-group">
        <label>Цена (₽)</label>
        <input type="number" id="price">
    </div>
    <div class="form-group">
        <label>Категория</label>
        <select id="category">
            <option value="strategy">Стратегии</option>
            <option value="survival">Выживание</option>
            <option value="shooter">Шутеры</option>
            <option value="rpg">РПГ</option>
        </select>
    </div>
    <div class="form-group">
        <label>Описание</label>
        <textarea id="description" rows="3"></textarea>
    </div>
    <button onclick="addProduct()">ДОБАВИТЬ В МАГАЗИН</button>
    <div id="message" class="msg"></div>

    <h2>Список товаров</h2>
    <div id="product-list">
        Загрузка товаров...
    </div>

    <script>
        const SUPABASE_URL = 'https://qkrwmswyhkkujzmqjfpi.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_J1l7LhGL2WCUaymu1jihJg_OE7IpYnt';

        // Загрузка товаров для списка
        async function loadProducts() {
            const list = document.getElementById('product-list');
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/products?select=*`, {
                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
                });
                const products = await response.json();

                if (products.length === 0) {
                    list.innerHTML = '<p style="text-align:center; color:#aaa;">Товаров пока нет.</p>';
                    return;
                }

                list.innerHTML = '';
                products.forEach(product => {
                    const item = document.createElement('div');
                    item.className = 'product-item';
                    item.innerHTML = `
                        <div class="product-info">
                            <div class="product-title">${product.title}</div>
                            <div class="product-price">${product.price} ₽</div>
                        </div>
                        <button class="delete-btn" onclick="deleteProduct(${product.id})">Удалить</button>
                    `;
                    list.appendChild(item);
                });
            } catch (error) {
                list.innerHTML = '<p style="text-align:center; color:red;">Ошибка загрузки списка.</p>';
            }
        }

        // Добавление товара
        async function addProduct() {
            const title = document.getElementById('title').value;
            const price = document.getElementById('price').value;
            const category = document.getElementById('category').value;
            const description = document.getElementById('description').value;
            const msg = document.getElementById('message');

            if (!title || !price) {
                msg.className = 'msg error';
                msg.innerText = 'Заполни название и цену!';
                return;
            }

            msg.className = 'msg';
            msg.innerText = 'Отправляем...';

            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/products`, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=minimal'
                    },
                    body: JSON.stringify({
                        title: title,
                        price: parseInt(price),
                        game_category: category,
                        description: description
                    })
                });

                if (response.ok) {
                    msg.className = 'msg success';
                    msg.innerText = 'Товар добавлен!';
                    document.getElementById('title').value = '';
                    document.getElementById('price').value = '';
                    document.getElementById('description').value = '';
                    loadProducts(); // Обновляем список
                } else {
                    throw new Error('Ошибка сервера');
                }
            } catch (error) {
                msg.className = 'msg error';
                msg.innerText = 'Ошибка: ' + error.message;
            }
        }

        // Удаление товара
        async function deleteProduct(id) {
            if (!confirm('Точно удалить этот товар?')) return;

            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/products?id=eq.${id}`, {
                    method: 'DELETE',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`
                    }
                });

                if (response.ok) {
                    loadProducts(); // Обновляем список после удаления
                } else {
                    alert('Ошибка при удалении');
                }
            } catch (error) {
                alert('Ошибка: ' + error.message);
            }
        }

        // Запускаем загрузку списка при открытии
        loadProducts();
    </script>
</body>
</html>
